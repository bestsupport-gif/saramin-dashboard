# .github/workflows/fetch-competitor-news.yml
#
# 매일 자동으로 경쟁사 뉴스를 수집해서 competitor-news.json을 저장소에 커밋합니다.
# 이 파일을 저장소의 .github/workflows/ 폴더 안에 업로드하세요.
# (경로가 정확해야 GitHub이 워크플로우로 인식합니다: .github/workflows/fetch-competitor-news.yml)

name: Fetch Competitor News

on:
  schedule:
    # 매일 한국시간 오전 8시 (UTC 기준 전날 23:00) 자동 실행
    - cron: '0 23 * * *'
  workflow_dispatch: {}  # Actions 탭에서 수동으로도 실행 가능

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 뉴스 수집 스크립트 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node fetch-news.js

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add competitor-news.json
          git diff --staged --quiet || git commit -m "chore: 경쟁사 뉴스 자동 업데이트 ($(date -u +'%Y-%m-%d'))"
          git push
