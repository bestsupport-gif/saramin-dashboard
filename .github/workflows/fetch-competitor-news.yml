# .github/workflows/fetch-competitor-news.yml
#
# 자동 스케줄 없이, "Run workflow" 버튼을 눌렀을 때만 실행됩니다.
# 이 파일을 저장소의 .github/workflows/fetch-competitor-news.yml 에 그대로 덮어쓰세요.

name: Fetch Competitor News

on:
  workflow_dispatch: {}  # Actions 탭에서 수동으로 눌러야만 실행됨 (자동 스케줄 없음)

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 뉴스 수집 스크립트 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node fetch-news.js

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add competitor-news.json
          git diff --staged --quiet || git commit -m "chore: 경쟁사 뉴스 수동 업데이트 ($(date -u +'%Y-%m-%d'))"
          git push
