name: Fetch App Store Ranks

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-ranks:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존 라이브러리 설치
        run: npm install google-play-scraper

      - name: 앱스토어 순위 수집 스크립트 실행
        run: node fetch-app-ranks.js

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app-ranks.json
          git diff --staged --quiet || git commit -m "chore: app ranks update"
          git push
