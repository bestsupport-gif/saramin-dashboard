nfunction fmtCompact(n){\n  if(n===null||n===undefined||isNaN(n)) return '—';\n  if(Math.abs(n)>=10000) return (n/10000).toFixed(1)+'만';\n  return fmt(n);\n}\nfunction pct(n,d){ return d? (n/d*100):0; }\n\n/* -------------------- NAV -------------------- */\ndocument.querySelectorAll('.nav-item').forEach(item=>{\n  item.addEventListener('click',()=>{\n    document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));\n    item.classList.add('active');\n    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));\n    document.getElementById('sec-'+item.dataset.section).classList.add('active');\n  });\n});\n\n/* -------------------- helpers to build tables per device -------------------- */\nfunction monthLabel(p){ // '2026-05' -> '26.05'\n  const [y,m] = p.split('-'); return y.slice(2)+'.'+m;\n}\nfunction activeDefaultBrands(brands, table){\n  // always default to 사람인 + 잡코리아 when available\n  const idxs = [];\n  const saraminIdx = brands.indexOf('사람인');\n  const jobkoreaIdx = brands.indexOf('잡코리아');\n  if(saraminIdx>=0) idxs.push(saraminIdx);\n  if(jobkoreaIdx>=0) idxs.push(jobkoreaIdx);\n  if(idxs.length===0){\n    // fallback: first two brands\n    idxs.push(0); if(brands.length>1) idxs.push(1);\n  }\n  return idxs;\n}\n\n/* ============ OVERVIEW ============ */\nlet overviewTrendChart;\nChart.defaults.animation = false;\nChart.defaults.font.family = '-apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"Apple SD Gothic Neo\", \"Helvetica Neue\", sans-serif';\nChart.register({\n  id:'drawReveal',\n  afterInit(chart){ chart.$rev = 0; chart.$revStart = null; },\n  beforeDatasetsDraw(chart){\n    if(chart.$rev === undefined || chart.$rev >= 1) return;\n    const a = chart.chartArea; if(!a) return;\n    const ctx = chart.ctx;\n    ctx.save();\n    ctx.beginPath();\n    ctx.rect(a.left, a.top - 40, (a.right - a.left) * chart.$rev, (a.bottom - a.top) + 80);\n    ctx.clip();\n    chart.$clipped = true;\n  },\n  afterDraw(chart){\n    if(chart.$clipped){ chart.ctx.restore(); chart.$clipped = false; }\n    if(chart.$rev !== undefined && chart.$rev < 1){\n      if(chart.$revStart === null) chart.$revStart = performance.now();\n      chart.$rev = Math.min(1, (performance.now() - chart.$revStart) / 1100);\n      requestAnimationFrame(()=>{ try{ chart.draw(); }catch(e){} });\n    }\n  }\n});\n\nfunction buildOverview(){\n  const pc = DATA.monthly_pc_users, aos = DATA.monthly_aos_users, ios = DATA.monthly_ios_users;\n  const lastPC = pc.data[pc.data.length-1], prevPC = pc.data[pc.data.length-2];\n  const lastAOS = aos.data[aos.data.length-1], prevAOS = aos.data[aos.data.length-2];\n  const lastIOS = ios.data[ios.data.length-1], prevIOS = ios.data[ios.data.length-2];\n\n  const wpc = DATA.weekly_pc_users, waos = DATA.weekly_aos_users, wios = DATA.weekly_ios_users;\n  const lastWPC = wpc.data[wpc.data.length-1], prevWPC = wpc.data[wpc.data.length-2];\n  const lastWAOS = waos.data[waos.data.length-1], prevWAOS = waos.data[waos.data.length-2];\n  const lastWIOS = wios.data[wios.data.length-1], prevWIOS = wios.data[wios.data.length-2];\n\n  document.getElementById('updatedChipMonth').textContent = '기준월 '+lastPC.p;\n  document.getElementById('updatedChipWeek').textContent = '기준주 '+weekLabel(lastWPC.p)+' 주';\n  const syncEl = document.getElementById('updatedChipSync');\n  if(DATA.meta && DATA.meta.uploadedAt){\n    const d = new Date(DATA.meta.uploadedAt);\n    const stamp = isNaN(d.getTime()) ? DATA.meta.uploadedAt : d.toLocaleString('ko-KR', {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});\n    syncEl.textContent = '최종 업데이트 '+stamp;\n  } else {\n    syncEl.textContent = '최종 업데이트 정보 없음';\n  }\n\n  const cards = [\n    {label:'PC web 순이용자수 (사람인)', val:lastPC.v[0], prevM:prevPC.v[0], curW:lastWPC.v[0], prevW:prevWPC.v[0], icon:'🖥️'},\n    {label:'Mobile app AOS 순이용자수', val:lastAOS.v[0], prevM:prevAOS.v[0], curW:lastWAOS.v[0], prevW:prevWAOS.v[0], icon:'🤖'},\n    {label:'Mobile app iOS 순이용자수', val:lastIOS.v[0], prevM:prevIOS.v[0], curW:lastWIOS.v[0], prevW:prevWIOS.v[0], icon:'🍎'},\n  ];\n\n  function deltaBadge(diffPct, tag){\n    if(diffPct===null) return '';\n    const up = diffPct>=0;\n    const cls = diffPct===0 ? 'flat' : (up?'up':'down');\n    const arrow = diffPct===0 ? '·' : (up?'▲':'▼');\n    return `<div class=\"kpi-delta ${cls}\">${arrow} ${Math.abs(diffPct).toFixed(1)}% <span style=\"font-weight:600;color:var(--text-faint);\">${tag}<\u002Fspan><\u002Fdiv>`;\n  }\n\n  const wrap = document.getElementById('kpiCards');\n  wrap.innerHTML = cards.map(c=>{\n    const dM = (c.prevM!==null && c.prevM!==undefined && c.val!==null) ? pct(c.val-c.prevM, c.prevM) : null;\n    const dW = (c.prevW!==null && c.prevW!==undefined && c.curW!==null) ? pct(c.curW-c.prevW, c.prevW) : null;\n    return `<div class=\"card kpi\">\n      <div class=\"kpi-top\"><div class=\"kpi-label\">${c.label}<\u002Fdiv><div class=\"kpi-badge\" style=\"background:linear-gradient(135deg, var(--primary-tint), #ffffff);\">${c.icon}<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi-split\">\n        <div class=\"kpi-split-row\">\n          <div class=\"kpi-split-head\">\n            <div class=\"kpi-split-label\">월간 · ${lastPC.p}<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"kpi-split-value\">${fmt(c.val)}<span>명<\u002Fspan><\u002Fdiv>\n          ${deltaBadge(dM,'전월비')}\n        <\u002Fdiv>\n        <div class=\"kpi-split-row\">\n          <div class=\"kpi-split-head\">\n            <div class=\"kpi-split-label\">주간 · ${weekLabel(lastWPC.p)}<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"kpi-split-value\">${fmt(c.curW)}<span>명<\u002Fspan><\u002Fdiv>\n          ${deltaBadge(dW,'전주비')}\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n\n  // trend chart: last 12 months, saramin across 3 devices (normalize? show raw counts, dual comparison)\n  const N=12;\n  const slice = pc.data.slice(-N);\n  const labels = slice.map(d=>monthLabel(d.p));\n  const pcSeries = slice.map(d=>d.v[0]);\n  const aosSeries = aos.data.slice(-N).map(d=>d.v[0]);\n  const iosSeries = ios.data.slice(-N).map(d=>d.v[0]);\n\n  if(overviewTrendChart){ overviewTrendChart.destroy(); }\n  overviewTrendChart = new Chart(document.getElementById('chartOverviewTrend'), {\n    type:'line',\n    data:{labels, datasets:[\n      {label:'PC web', data:pcSeries, order:3, borderColor:'#2F6BFF', backgroundColor:areaGradient('#C9DAFF'), fill:'origin', tension:.35, pointRadius:2, borderWidth:2.5},\n      {label:'Mobile app (AOS)', data:aosSeries, order:2, borderColor:'#14B8A6', backgroundColor:areaGradient('#B9EBE2'), fill:'origin', tension:.35, pointRadius:2, borderWidth:2.5},\n      {label:'Mobile app (iOS)', data:iosSeries, order:1, borderColor:'#F2B134', backgroundColor:areaGradient('#FBE3B4'), fill:'origin', tension:.35, pointRadius:2, borderWidth:2.5},\n    ]},\n    options: baseLineOptions(),\n    plugins: [linesOnTop]\n  });\n\n  refreshRankList();\n  buildAppOverview();\n}\n\nlet overviewMauChart;\nfunction buildAppOverview(){\n  const mauAos = DATA.app_mau_aos, mauIos = DATA.app_mau_ios;\n  const insAos = DATA.app_install_aos, insIos = DATA.app_install_ios;\n  const iSar = mauAos.brands.indexOf('사람인');\n\n  const lastMauAos = mauAos.data[mauAos.data.length-1], prevMauAos = mauAos.data[mauAos.data.length-2];\n  const lastMauIos = mauIos.data[mauIos.data.length-1], prevMauIos = mauIos.data[mauIos.data.length-2];\n  const lastInsAos = insAos.data[insAos.data.length-1], prevInsAos = insAos.data[insAos.data.length-2];\n  const lastInsIos = insIos.data[insIos.data.length-1], prevInsIos = insIos.data[insIos.data.length-2];\n\n  function deltaBadge(diffPct, tag){\n    if(diffPct===null || diffPct===undefined || isNaN(diffPct)) return '';\n    const up = diffPct>=0;\n    const cls = diffPct===0 ? 'flat' : (up?'up':'down');\n    const arrow = diffPct===0 ? '·' : (up?'▲':'▼');\n    return `<div class=\"kpi-delta ${cls}\">${arrow} ${Math.abs(diffPct).toFixed(1)}% <span style=\"font-weight:600;color:var(--text-faint);\">${tag}<\u002Fspan><\u002Fdiv>`;\n  }\n  function safePct(cur, prev){\n    if(cur===null||cur===undefined||prev===null||prev===undefined) return null;\n    return pct(cur-prev, prev);\n  }\n\n  const appCards = [\n    {\n      label:'사람인 앱 활성 사용자수 (MAU)', icon:'📱',\n      rows:[\n        {tag:'Android (AOS) · '+monthLabel(lastMauAos.p), val:lastMauAos.v[iSar], delta:safePct(lastMauAos.v[iSar], prevMauAos.v[iSar])},\n        {tag:'iOS · '+monthLabel(lastMauIos.p), val:lastMauIos.v[iSar], delta:safePct(lastMauIos.v[iSar], prevMauIos.v[iSar])},\n      ]\n    },\n    {\n      label:'사람인 앱 신규 설치수', icon:'⬇️',\n      rows:[\n        {tag:'Android (AOS) · '+monthLabel(lastInsAos.p), val:lastInsAos.v[iSar], delta:safePct(lastInsAos.v[iSar], prevInsAos.v[iSar])},\n        {tag:'iOS · '+monthLabel(lastInsIos.p), val:lastInsIos.v[iSar], delta:safePct(lastInsIos.v[iSar], prevInsIos.v[iSar])},\n      ]\n    },\n  ];\n\n  document.getElementById('appKpiCards').innerHTML = appCards.map(c=>`\n    <div class=\"card kpi\">\n      <div class=\"kpi-top\"><div class=\"kpi-label\">${c.label}<\u002Fdiv><div class=\"kpi-badge\" style=\"background:linear-gradient(135deg, #F6EFE3, #ffffff);\">${c.icon}<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi-split\">\n        ${c.rows.map(r=>`\n        <div class=\"kpi-split-row\">\n          <div class=\"kpi-split-head\"><div class=\"kpi-split-label\">${r.tag}<\u002Fdiv><\u002Fdiv>\n          <div class=\"kpi-split-value\">${fmt(r.val)}<span>명<\u002Fspan><\u002Fdiv>\n          ${deltaBadge(r.delta, '전월비')}\n        <\u002Fdiv>`).join('')}\n      <\u002Fdiv>\n    <\u002Fdiv>`).join('');\n\n  const N=12;\n  const sliceAos = mauAos.data.slice(-N);\n  const labels = sliceAos.map(d=>monthLabel(d.p));\n  const aosSeries2 = sliceAos.map(d=>d.v[iSar]);\n  const iosSeries2 = mauIos.data.slice(-N).map(d=>d.v[iSar]);\n\n  if(overviewMauChart){ overviewMauChart.destroy(); }\n  overviewMauChart = new Chart(document.getElementById('chartOverviewMau'), {\n    type:'line',\n    data:{labels, datasets:[\n      {label:'Android (AOS)', data:aosSeries2, order:2, borderColor:'#7C5CFF', backgroundColor:areaGradient('#D9CEFF'), fill:'origin', tension:.35, pointRadius:2, borderWidth:2.5},\n      {label:'iOS', data:iosSeries2, order:1, borderColor:'#F2B134', backgroundColor:areaGradient('#FBE3B4'), fill:'origin', tension:.35, pointRadius:2, borderWidth:2.5},\n    ]},\n    options: baseLineOptions(),\n    plugins: [linesOnTop]\n  });\n}\n\nconst rankState = {device:'pc', period:'monthly'};\n\nfunction refreshRankList(){\n  const key = trafficDataKey(rankState.device, 'users', rankState.period);\n  const table = key ? DATA[key] : null;\n  if(!table){\n    document.getElementById('rankList').innerHTML = '<div class=\"note\" style=\"padding:12px 0;\">데이터가 없습니다.<\u002Fdiv>';\n    return;\n  }\n  const last = table.data[table.data.length-1];\n  const labelFn = rankState.period==='weekly' ? weekLabel : monthLabel;\n  const arr = table.brands.map((b,i)=>({b, v:last.v[i]||0})).filter(d=>d.v>0).sort((a,b)=>b.v-a.v);\n  const max = arr.length ? arr[0].v : 1;\n  const periodTxt = rankState.period==='weekly' ? (labelFn(last.p)+' 주') : labelFn(last.p);\n  document.getElementById('rankSub').textContent = periodTxt+' 기준';\n  document.getElementById('rankList').innerHTML = arr.map((d,i)=>`\n    <div class=\"rank-row\">\n      <div class=\"rank-idx\">${i+1}<\u002Fdiv>\n      <div class=\"rank-name\" style=\"color:${d.b==='사람인'?'var(--primary-dark)':'var(--text)'}\">${d.b}<\u002Fdiv>\n      <div class=\"rank-bar-bg\"><div class=\"rank-bar\" style=\"width:${pct(d.v,max)}%;background:${colorOf(d.b)};\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"rank-val\">${fmt(d.v)}<\u002Fdiv>\n    <\u002Fdiv>`).join('');\n}\n\ndocument.getElementById('rankDeviceSeg').addEventListener('click', e=>{\n  const btn = e.target.closest('button'); if(!btn) return;\n  document.querySelectorAll('#rankDeviceSeg button').forEach(b=>b.classList.remove('active'));\n  btn.classList.add('active');\n  rankState.device = btn.dataset.device;\n  refreshRankList();\n});\ndocument.getElementById('rankPeriodSeg').addEventListener('click', e=>{\n  const btn = e.target.closest('button'); if(!btn) return;\n  document.querySelectorAll('#rankPeriodSeg button').forEach(b=>b.classList.remove('active'));\n  btn.classList.add('active');\n  rankState.period = btn.dataset.period;\n  refreshRankList();\n});\n\nfunction areaGradient(topColor){\n  return (ctx)=>{\n    const {chart} = ctx;\n    const {ctx:c, chartArea} = chart;\n    if(!chartArea) return topColor;\n    const g = c.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);\n    g.addColorStop(0, topColor);\n    g.addColorStop(1, '#FFFFFF');\n    return g;\n  };\n}\n\nfunction baseLineOptions(){\n  return {\n    responsive:true, maintainAspectRatio:false,\n    interaction:{mode:'index', intersect:false},\n    plugins:{\n  legend:{display:true, position:'top', align:'end', labels:{boxWidth:8, boxHeight:8, usePointStyle:true, pointStyle:'circle', font:{size:11, weight:500}}},\n      tooltip:{callbacks:{label:(ctx)=>` ${ctx.dataset.label}: ${fmt(ctx.parsed.y)}`}}\n    },\n    scales:{\n      x:{grid:{display:false}, ticks:{font:{size:10.5}, maxRotation:0, autoSkip:true, maxTicksLimit:12}},\n      y:{grid:{color:'#EEF0F4'}, ticks:{font:{size:10.5}, callback:v=>fmtCompact(v)}}\n    }\n  };\n}\n\n/* ============ TRAFFIC (unified monthly/weekly, users/pv) ============ */\nfunction trafficDataKey(device, metric, period){\n  const map = {\n    users: {\n      monthly: {pc:'monthly_pc_users', aos:'monthly_aos_users', ios:'monthly_ios_users'},\n      weekly:  {pc:'weekly_pc_users',  aos:'weekly_aos_users',  ios:'weekly_ios_users'},\n    },\n    pv: {\n      monthly: {pc:'monthly_pc_pv', aos:'monthly_aos_installs'},\n      weekly:  {pc:'weekly_pc_pv',  aos:'weekly_aos_installs'},\n    }\n  };\n  return map[metric]?.[period]?.[device] || null;\n}\n\nfunction metricLabel(metric, device){\n  if(metric==='users') return '순이용자수';\n  return device==='pc' ? '총 페이지뷰' : '순설치자수';\n}\nfunction deviceLabel(device){\n  return {pc:'PC web', aos:'Mobile app · AOS', ios:'Mobile app · iOS'}[device];\n}\nfunction periodLabel(period){ return period==='monthly' ? '월간' : '주간'; }\nfunction unitLabel(metric, device){\n  if(metric==='users') return '단위: 명';\n  return device==='pc' ? '단위: *1,000' : '단위: 명';\n}\n\nlet trafficChart;\nconst trafficState = {device:'pc', metric:'users', period:'monthly', active:new Set(), startIdx:0, endIdx:0, _lastKey:null};\n\nfunction renderMultiLine(canvasEl, existingChart, table, labelsFn, activeSet){\n  const datasets = table.brands.map((b,i)=>{\n    const c = colorOf(b);\n    return {\n      label:b,\n      data: table.data.map(d=>d.v[i]),\n      borderColor:c,\n      backgroundColor:c+'20',\n      borderWidth: b==='사람인'?3:2,\n      pointRadius:0,\n      tension:.3,\n      hidden: !activeSet.has(b),\n      spanGaps:true,\n    };\n  });\n  const labels = table.data.map(labelsFn);\n  if(existingChart){ existingChart.destroy(); }\n  return new Chart(canvasEl, {\n    type:'line',\n    data:{labels, datasets},\n    options: Object.assign(baseLineOptions(), {plugins:Object.assign({},baseLineOptions().plugins,{legend:{display:false}})}),\n    plugins: [linesOnTop]\n  });\n}\n\n// 선택되지 않은 브랜드도 \"누르면 그래프에 추가된다\"는 걸 클릭 전에 알 수 있도록:\n// (1) 점선 테두리 + \"+\" 표시, (2) 안내 문구, (3) 전체선택/사람인만 버튼,\n// (4) 마우스만 올려도 해당 브랜드 선이 옅게 미리보기로 그려짐.\nfunction chartForLegend(containerEl){\n  const card = containerEl.closest('.card');\n  const canvas = card && card.querySelector('canvas');\n  if(!canvas) return null;\n  try{ return Object.values(Chart.instances||{}).find(c=>c.canvas===canvas) || null; }catch(e){ return null; }\n}\nfunction previewBrand(containerEl, brand, on){\n  const chart = chartForLegend(containerEl);\n  if(!chart) return;\n  const ds = chart.data.datasets.find(d=>d.label===brand);\n  if(!ds) return;\n  if(on){\n    if(!ds.hidden) return;\n    ds._preview = {borderWidth:ds.borderWidth, borderDash:ds.borderDash, borderColor:ds.borderColor};\n    ds.hidden = false;\n    ds.borderWidth = 2;\n    ds.borderDash = [5,4];\n    ds.borderColor = colorOf(brand)+'99';\n  } else if(ds._preview){\n    ds.hidden = true;\n    ds.borderWidth = ds._preview.borderWidth;\n    ds.borderDash = ds._preview.borderDash;\n    ds.borderColor = ds._preview.borderColor;\n    delete ds._preview;\n  } else return;\n  chart.update('none');\n}\nfunction renderLegendChips(containerEl, brands, activeSet, onToggle){\n  let head = containerEl.previousElementSibling;\n  if(!head || !head.classList.contains('legend-head')){\n    head = document.createElement('div');\n    head.className = 'legend-head';\n    head.innerHTML = `<span class=\"legend-hint\">브랜드를 <b>클릭<\u002Fb>하면 그래프에 추가·제거됩니다 · 마우스를 올리면 미리보기<\u002Fspan>\n      <span class=\"legend-bulk\"><button type=\"button\" data-bulk=\"all\">전체 선택<\u002Fbutton><button type=\"button\" data-bulk=\"reset\">사람인만<\u002Fbutton><\u002Fspan>`;\n    containerEl.parentNode.insertBefore(head, containerEl);\n    head.addEventListener('click', e=>{\n      const btn = e.target.closest('button[data-bulk]'); if(!btn) return;\n      const list = head._brands || [];\n      activeSet.clear();\n      if(btn.dataset.bulk==='all') list.forEach(b=>activeSet.add(b));\n      else activeSet.add(list.includes('사람인') ? '사람인' : list[0]);\n      onToggle();\n    });\n  }\n  head._brands = brands;\n\n  containerEl.innerHTML = brands.map(b=>{\n    const isActive = activeSet.has(b);\n    return `<span class=\"chip ${isActive?'active':''}\" data-brand=\"${b}\" style=\"--c:${colorOf(b)}\" title=\"${isActive?'클릭하면 그래프에서 제외':'클릭하면 그래프에 추가'}\">${isActive?'<span class=\"sw\"><\u002Fspan>':'<span class=\"plus\">+<\u002Fspan>'}${b}<\u002Fspan>`;\n  }).join('');\n  containerEl.querySelectorAll('.chip').forEach(chip=>{\n    const b = chip.dataset.brand;\n    chip.addEventListener('click',()=>{\n      previewBrand(containerEl, b, false);\n      if(activeSet.has(b)) activeSet.delete(b); else activeSet.add(b);\n      onToggle();\n    });\n    if(!chip.classList.contains('active')){\n      chip.addEventListener('mouseenter', ()=>previewBrand(containerEl, b, true));\n      chip.addEventListener('mouseleave', ()=>previewBrand(containerEl, b, false));\n    }\n  });\n}\n\nfunction weekLabel(p){\n  const s=p.split('~')[0]; return s.slice(4,6)+'.'+s.slice(6,8);\n}\n\nfunction currentFullTable(){\n  const key = trafficDataKey(trafficState.device, trafficState.metric, trafficState.period);\n  return key ? {key, table: DATA[key]} : {key:null, table:null};\n}\n\n// Rebuild the start/end <select> option lists when device/metric/period changes.\n// Keeps the previously selected date range if the new series is the same length/kind,\n// otherwise falls back to a sensible default window.\nfunction populateRangeSelectors(full, key){\n  const isWeekly = trafficState.period==='weekly';\n  const labelFn = isWeekly ? (p=>weekLabel(p)) : (p=>monthLabel(p));\n  const startSel = document.getElementById('trafficStartSel');\n  const endSel = document.getElementById('trafficEndSel');\n  const optionsHtml = full.data.map((d,i)=>`<option value=\"${i}\">${labelFn(d.p)}<\u002Foption>`).join('');\n  startSel.innerHTML = optionsHtml;\n  endSel.innerHTML = optionsHtml;\n\n  let startIdx = 0, endIdx = full.data.length-1;\n  if(trafficState._lastKey===key){\n    startIdx = Math.min(trafficState.startIdx, full.data.length-1);\n    endIdx = Math.min(trafficState.endIdx, full.data.length-1);\n  } else if(isWeekly){\n    // default: most recent ~26 weeks\n    startIdx = Math.max(0, full.data.length-26);\n  }\n  if(startIdx>endIdx) startIdx = endIdx;\n  startSel.value = startIdx;\n  endSel.value = endIdx;\n  trafficState.startIdx = startIdx;\n  trafficState.endIdx = endIdx;\n  trafficState._lastKey = key;\n}\n\nfunction refreshTraffic(repopulate){\n  const {device, metric, period} = trafficState;\n  const {key, table:full} = currentFullTable();\n\n  if(!full){\n    document.getElementById('trafficChartTitle').textContent = '데이터 없음';\n    document.getElementById('trafficLegend').innerHTML = '';\n    document.getElementById('trafficTable').innerHTML = '<tr><td style=\"padding:16px;color:var(--text-faint);\">iOS는 페이지뷰/설치자수 데이터가 제공되지 않습니다.<\u002Ftd><\u002Ftr>';\n    if(trafficChart){ trafficChart.destroy(); trafficChart=null; }\n    return;\n  }\n\n  if(trafficState.active.size===0){\n    activeDefaultBrands(full.brands, full).forEach(i=>trafficState.active.add(full.brands[i]));\n  }\n  if(repopulate) populateRangeSelectors(full, key);\n\n  const isWeekly = period==='weekly';\n  const s = trafficState.startIdx, e = trafficState.endIdx;\n  const table = {brands: full.brands, data: full.data.slice(s, e+1)};\n\n  const title = `${deviceLabel(device)} · ${periodLabel(period)} ${metricLabel(metric, device)}`;\n  document.getElementById('trafficChartTitle').textContent = title;\n\n  renderLegendChips(document.getElementById('trafficLegend'), table.brands, trafficState.active, ()=>refreshTraffic(false));\n  const labelsFn = isWeekly ? (d=>weekLabel(d.p)) : (d=>monthLabel(d.p));\n  trafficChart = renderMultiLine(document.getElementById('chartTraffic'), trafficChart, table, labelsFn, trafficState.active);\n\n  // data table mirrors the exact selected range\n  const unitLbl = unitLabel(metric, device);\n  document.getElementById('trafficTableTitle').textContent = '선택 기간 데이터';\n  document.getElementById('trafficTableHint').textContent = unitLbl;\n  const labelFn2 = isWeekly ? (p=>weekLabel(p)) : (p=>monthLabel(p));\n  let html = '<thead><tr><th>브랜드<\u002Fth>'+table.data.map(d=>`<th>${labelFn2(d.p)}<\u002Fth>`).join('')+'<\u002Ftr><\u002Fthead><tbody>';\n  full.brands.forEach((b,i)=>{\n    html += `<tr class=\"${b==='사람인'?'highlight':''}\"><td>${b}<\u002Ftd>`+table.data.map(d=>`<td>${fmt(d.v[i])}<\u002Ftd>`).join('')+'<\u002Ftr>';\n  });\n  html += '<\u002Ftbody>';\n  document.getElementById('trafficTable').innerHTML = html;\n}\n\ndocument.getElementById('trafficDeviceSeg').addEventListener('click', e=>{\n  const btn = e.target.closest('button'); if(!btn) return;\n  document.querySelectorAll('#trafficDeviceSeg button').forEach(b=>b.classList.remove('active'));\n  btn.classList.add('active');\n  trafficState.device = btn.dataset.device;\n  // iOS has no PV/installs data — fall back to 순이용자수\n  const metricSegWrap = document.getElementById('trafficMetricSeg');\n  const pvBtn = metricSegWrap.querySelector('[data-metric=\"pv\"]');\n  if(trafficState.device==='ios'){\n    pvBtn.style.opacity = '.4';\n    pvBtn.style.pointerEvents = 'none';\n    if(trafficState.metric==='pv'){\n      trafficState.metric = 'users';\n      metricSegWrap.querySelectorAll('button').forEach(b=>b.classList.remove('active'));\n      metricSegWrap.querySelector('[data-metric=\"users\"]').classList.add('active');\n    }\n  } else {\n    pvBtn.style.opacity = '';\n    pvBtn.style.pointerEvents = '';\n  }\n  refreshTraffic(true);\n});\ndocument.getElementById('trafficMetricSeg').addEventListener('click', e=>{\n  const btn = e.target.closest('button'); if(!btn) return;\n  if(btn.style.pointerEvents==='none') return;\n  document.querySelectorAll('#trafficMetricSeg button').forEach(b=>b.classList.remove('active'));\n  btn.classList.add('active');\n  trafficState.metric = btn.dataset.metric;\n  refreshTraffic(true);\n});\ndocument.getElementById('trafficPeriodSeg').addEventListener('click', e=>{\n  const btn = e.target.closest('button'); if(!btn) return;\n  document.querySelectorAll('#trafficPeriodSeg button').forEach(b=>b.classList.remove('active'));\n  btn.classList.add('active');\n  trafficState.period = btn.dataset.period;\n  refreshTraffic(true);\n});\ndocument.getElementById('trafficStartSel').addEventListener('change', e=>{\n  let s = parseInt(e.target.value,10);\n  if(s>trafficState.endIdx){ s = trafficState.endIdx; e.target.value = s; }\n  trafficState.startIdx = s;\n  refreshTraffic(false);\n});\ndocument.getElementById('trafficEndSel').addEventListener('change', e=>{\n  let en = parseInt(e.target.value,10);\n  if(en<trafficState.startIdx){ en = trafficState.startIdx; e.target.value = en; }\n  trafficState.endIdx = en;\n  refreshTraffic(false);\n});\n\n/* ============ GENERIC APP METRIC TAB (MAU / 신규설치) ============ */\nfunction setupAppMetricTab(cfg){\n  // cfg: {prefix, dataKeys:{aos,ios}, deviceLabels:{aos,ios}, titleWord, unit}\n  const state = {device:'aos', active:new Set(), startIdx:0, endIdx:0, _lastKey:null};\n\n  function currentTable(){\n    const key = cfg.dataKeys[state.device];\n    return {key, table: DATA[key]};\n  }\n\n  function populateRangeSelectors(full, key){\n    const startSel = document.getElementById(cfg.prefix+'StartSel');\n    const endSel = document.getElementById(cfg.prefix+'EndSel');\n    const optionsHtml = full.data.map((d,i)=>`<option value=\"${i}\">${monthLabel(d.p)}<\u002Foption>`).join('');\n    startSel.innerHTML = optionsHtml;\n    endSel.innerHTML = optionsHtml;\n    let startIdx = 0, endIdx = full.data.length-1;\n    if(state._lastKey===key){\n      startIdx = Math.min(state.startIdx, full.data.length-1);\n      endIdx = Math.min(state.endIdx, full.data.length-1);\n    } else {\n      // default: most recent 24 months\n      startIdx = Math.max(0, full.data.length-24);\n    }\n    if(startIdx>endIdx) startIdx = endIdx;\n    startSel.value = startIdx;\n    endSel.value = endIdx;\n    state.startIdx = startIdx;\n    state.endIdx = endIdx;\n    state._lastKey = key;\n  }\n\n  function refresh(repopulate){\n    const {key, table:full} = currentTable();\n    if(state.active.size===0){\n      activeDefaultBrands(full.brands, full).forEach(i=>state.active.add(full.brands[i]));\n    }\n    if(repopulate) populateRangeSelectors(full, key);\n\n    const s = state.startIdx, e = state.endIdx;\n    const table = {brands: full.brands, data: full.data.slice(s, e+1)};\n\n    document.getElementById(cfg.prefix+'ChartTitle').textContent = `${cfg.deviceLabels[state.device]} · 월간 ${cfg.titleWord}`;\n    renderLegendChips(document.getElementById(cfg.prefix+'Legend'), table.brands, state.active, ()=>refresh(false));\n    state.chart = renderMultiLine(document.getElementById(cfg.chartId), state.chart, table, d=>monthLabel(d.p), state.active);\n\n    let html = '<thead><tr><th>브랜드<\u002Fth>'+table.data.map(d=>`<th>${monthLabel(d.p)}<\u002Fth>`).join('')+'<\u002Ftr><\u002Fthead><tbody>';\n    full.brands.forEach((b,i)=>{\n      html += `<tr class=\"${b==='사람인'?'highlight':''}\"><td>${b}<\u002Ftd>`+table.data.map(d=>`<td>${fmt(d.v[i])}<\u002Ftd>`).join('')+'<\u002Ftr>';\n    });\n    html += '<\u002Ftbody>';\n    document.getElementById(cfg.prefix+'Table').innerHTML = html;\n  }\n\n  document.getElementById(cfg.prefix+'DeviceSeg').addEventListener('click', e=>{\n    const btn = e.target.closest('button'); if(!btn) return;\n    document.querySelectorAll('#'+cfg.prefix+'DeviceSeg button').forEach(b=>b.classList.remove('active'));\n    btn.classList.add('active');\n    state.device = btn.dataset.device;\n    refresh(true);\n  });\n  document.getElementById(cfg.prefix+'StartSel').addEventListener('change', e=>{\n    let s = parseInt(e.target.value,10);\n    if(s>state.endIdx){ s = state.endIdx; e.target.value = s; }\n    state.startIdx = s;\n    refresh(false);\n  });\n  document.getElementById(cfg.prefix+'EndSel').addEventListener('change', e=>{\n    let en = parseInt(e.target.value,10);\n    if(en<state.startIdx){ en = state.startIdx; e.target.value = en; }\n    state.endIdx = en;\n    refresh(false);\n  });\n\n  refresh(true);\n}\n\n\n\n/* ============ RAW DATA UPLOAD ============ */\nlet uploadedFileBlob = null;\nlet uploadedFileName = null;\nlet uploadedAppFileBlob = null;\nlet uploadedAppFileName = null;\n\nfunction normalizeMonthPeriod(p){\n  const m = /^(\\d{4})년\\s*(\\d{1,2})월/.exec(String(p).trim());\n  if(m) return m[1]+'-'+m[2].padStart(2,'0');\n  return String(p).trim();\n}\nfunction isSectionHeaderCell(v){\n  return typeof v === 'string' && /^\\d+\\.\\s*\\S/.test(v.trim());\n}\nfunction isPeriodCell(v, isWeekly){\n  if(v===null || v===undefined || v==='') return false;\n  const s = String(v).trim();\n  if(isWeekly) return /^\\d{8}~\\d{8}$/.test(s);\n  return /^\\d{4}년\\s*\\d{1,2}월/.test(s) || /^\\d{4}-\\d{2}$/.test(s);\n}\n\n// Parses one worksheet that may contain multiple stacked sections\n// (each starting with a \"N. 라벨\" row, followed by a brand header row, then data rows).\nfunction parseSheetSections(ws, isWeekly){\n  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});\n  const sectionStarts = [];\n  rows.forEach((row,i)=>{ if(row && isSectionHeaderCell(row[0])) sectionStarts.push(i); });\n  const sections = [];\n  sectionStarts.forEach((startIdx, si)=>{\n    const endIdx = si+1<sectionStarts.length ? sectionStarts[si+1] : rows.length;\n    const brandRow = rows[startIdx+1] || [];\n    const brands = [];\n    for(let c=1;c<brandRow.length;c++){\n      const v = brandRow[c];\n      if(v===null || v===undefined || v==='') break;\n      brands.push(String(v).trim());\n    }\n    const data = [];\n    for(let r=startIdx+2; r<endIdx; r++){\n      const row = rows[r];\n      if(!row || !isPeriodCell(row[0], isWeekly)) continue;\n      const period = isWeekly ? String(row[0]).trim() : normalizeMonthPeriod(row[0]);\n      const vals = brands.map((_,ci)=>{\n        const v = row[1+ci];\n        return (typeof v === 'number') ? v : null;\n      });\n      data.push({p:period, v:vals});\n    }\n    sections.push({brands, data});\n  });\n  return sections;\n}\n\nconst SHEET_PLAN = [\n  {sheet:'1. 월간_PC', weekly:false, keys:['monthly_pc_users','monthly_pc_pv']},\n  {sheet:'2. 월간_Mobile.app_AOS', weekly:false, keys:['monthly_aos_users','monthly_aos_installs']},\n  {sheet:'3. 월간_Mobile.app_IOS', weekly:false, keys:['monthly_ios_users']},\n  {sheet:'1. 주간_PC', weekly:true, keys:['weekly_pc_users','weekly_pc_pv']},\n  {sheet:'2. 주간_Mobile.app_AOS', weekly:true, keys:['weekly_aos_users','weekly_aos_installs']},\n  {sheet:'2. 주간_Mobile.app_IOS', weekly:true, keys:['weekly_ios_users']},\n];\n\nfunction parseWorkbookIntoData(workbook){\n  const newData = {};\n  const log = [];\n  SHEET_PLAN.forEach(plan=>{\n    const ws = workbook.Sheets[plan.sheet];\n    if(!ws){\n      log.push(`⚠ 시트를 찾지 못했습니다: \"${plan.sheet}\" (건너뜀)`);\n      return;\n    }\n    const sections = parseSheetSections(ws, plan.weekly);\n    plan.keys.forEach((key,i)=>{\n      const sec = sections[i];\n      if(!sec || sec.data.length===0){\n        log.push(`⚠ \"${plan.sheet}\"에서 ${i+1}번째 표를 읽지 못했습니다 (${key})`);\n        return;\n      }\n      newData[key] = sec;\n      log.push(`✓ ${key}: ${sec.brands.length}개 브랜드 · ${sec.data.length}개 기간 (${sec.data[0].p} ~ ${sec.data[sec.data.length-1].p})`);\n    });\n  });\n  return {newData, log};\n}\n\nfunction handleWorkbookFile(file){\n  const reader = new FileReader();\n  const logEl = document.getElementById('rawLog');\n  logEl.className = 'raw-log show';\n  logEl.textContent = `\"${file.name}\" 파일을 읽는 중...`;\n  reader.onload = (e)=>{\n    try{\n      const buf = new Uint8Array(e.target.result);\n      const workbook = XLSX.read(buf, {type:'array'});\n      const {newData, log} = parseWorkbookIntoData(workbook);\n      const requiredKeys = ['monthly_pc_users','monthly_aos_users','monthly_ios_users','weekly_pc_users','weekly_aos_users','weekly_ios_users'];\n      const missing = requiredKeys.filter(k=>!newData[k]);\n      if(missing.length>0){\n        logEl.className = 'raw-log show error';\n        logEl.textContent = '업데이트 실패 — 필수 데이터를 찾을 수 없습니다.\\\\n\\\\n'+log.join('\\\\n');\n        return;\n      }\n      Object.assign(DATA, newData);\n      DATA.meta = {uploadedAt: new Date().toISOString(), sourceFileName: file.name};\n\n      // reset chart/range state so selectors repopulate against the new series\n      trafficState.active = new Set();\n      trafficState._lastKey = null;\n      buildOverview();\n      refreshTraffic(true);\n\n      uploadedFileBlob = file;\n      uploadedFileName = file.name;\n      document.getElementById('rawDownloadBtn').disabled = false;\n      document.getElementById('rawStatusPill').textContent = `\"${file.name}\" 데이터 적용됨 · 방금 업데이트`;\n      document.getElementById('rawStatusPill').classList.add('ok');\n      const ghBtn = document.getElementById('ghDeployBtn');\n      ghBtn.disabled = false;\n      ghBtn.textContent = 'GitHub에 배포하기';\n      document.getElementById('rawFileMeta').textContent = `파일 크기 ${(file.size/1024).toFixed(0)}KB · 업로드 시각 ${new Date().toLocaleString('ko-KR')}`;\n\n      logEl.className = 'raw-log show';\n      logEl.textContent = '✅ 대시보드에 반영되었습니다.\\\\n\\\\n'+log.join('\\\\n');\n    }catch(err){\n      logEl.className = 'raw-log show error';\n      logEl.textContent = '파일을 읽는 중 오류가 발생했습니다: '+err.message;\n    }\n  };\n  reader.onerror = ()=>{\n    logEl.className = 'raw-log show error';\n    logEl.textContent = '파일을 읽을 수 없습니다. 다시 시도해주세요.';\n  };\n  reader.readAsArrayBuffer(file);\n}\n\ndocument.getElementById('rawFileInput').addEventListener('change', e=>{\n  if(e.target.files && e.target.files[0]) handleWorkbookFile(e.target.files[0]);\n});\n\nconst rawDropEl = document.getElementById('rawDrop');\n['dragenter','dragover'].forEach(evt=>{\n  rawDropEl.addEventListener(evt, e=>{ e.preventDefault(); rawDropEl.classList.add('drag'); });\n});\n['dragleave','drop'].forEach(evt=>{\n  rawDropEl.addEventListener(evt, e=>{ e.preventDefault(); rawDropEl.classList.remove('drag'); });\n});\nrawDropEl.addEventListener('drop', e=>{\n  const file = e.dataTransfer.files && e.dataTransfer.files[0];\n  if(file) handleWorkbookFile(file);\n});\n\n/* ---- 모바일인덱스 (MAU / 신규설치) workbook parsing ---- */\nconst APP_SHEET_PLAN = [\n  {sheet:'사람인 경쟁사_MAU_21.05~26.07', keys:{aos:'app_mau_aos', ios:'app_mau_ios'}},\n  {sheet:'사람인 경쟁사_신규설치_21.05~26.07', keys:{aos:'app_install_aos', ios:'app_install_ios'}},\n];\n\nfunction parseAppSheet(ws){\n  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});\n  // header row: find the row whose first cell (col 0 as SheetJS sees it — the sheet's\n  // used range starts at column B since column A is always blank) is '날짜'\n  let headerIdx = -1;\n  for(let i=0;i<rows.length;i++){\n    if(rows[i] && rows[i][0]==='날짜'){ headerIdx = i; break; }\n  }\n  if(headerIdx===-1) return null;\n  const headerRow = rows[headerIdx];\n  const brandCols = headerRow.slice(1); // brand(AOS), brand(IOS), brand(AOS), ...\n  const brands = [];\n  for(let i=0;i<brandCols.length;i+=2){\n    const label = brandCols[i];\n    if(label===null || label===undefined || label==='') continue;\n    brands.push(String(label).split('(')[0].trim());\n  }\n  const aosData = [];\n  const iosData = [];\n  for(let r=headerIdx+1; r<rows.length; r++){\n    const row = rows[r];\n    if(!row || row[0]===null || row[0]===undefined) break;\n    let period;\n    const dv = row[0];\n    if(dv instanceof Date){\n      period = `${dv.getFullYear()}-${String(dv.getMonth()+1).padStart(2,'0')}`;\n    } else if(typeof dv === 'number'){\n      const parsed = XLSX.SSF.parse_date_code(dv);\n      period = `${parsed.y}-${String(parsed.m).padStart(2,'0')}`;\n    } else {\n      const m = /^(\\d{4})[-./](\\d{1,2})/.exec(String(dv));\n      period = m ? `${m[1]}-${m[2].padStart(2,'0')}` : String(dv);\n    }\n    const aosVals = [], iosVals = [];\n    for(let bi=0; bi<brands.length; bi++){\n      const a = row[1+bi*2], b = row[2+bi*2];\n      aosVals.push(typeof a==='number' ? a : null);\n      iosVals.push(typeof b==='number' ? b : null);\n    }\n    aosData.push({p:period, v:aosVals});\n    iosData.push({p:period, v:iosVals});\n  }\n  if(aosData.length===0) return null;\n  return {brands, aosData, iosData};\n}\n\nfunction parseAppWorkbookIntoData(workbook){\n  const newData = {};\n  const log = [];\n  APP_SHEET_PLAN.forEach(plan=>{\n    const ws = workbook.Sheets[plan.sheet];\n    if(!ws){\n      log.push(`⚠ 시트를 찾지 못했습니다: \"${plan.sheet}\" (건너뜀)`);\n      return;\n    }\n    const parsed = parseAppSheet(ws);\n    if(!parsed){\n      log.push(`⚠ \"${plan.sheet}\"에서 데이터를 읽지 못했습니다.`);\n      return;\n    }\n    newData[plan.keys.aos] = {brands: parsed.brands, data: parsed.aosData};\n    newData[plan.keys.ios] = {brands: parsed.brands, data: parsed.iosData};\n    log.push(`✓ ${plan.sheet}: ${parsed.brands.length}개 브랜드 · ${parsed.aosData.length}개월 (${parsed.aosData[0].p} ~ ${parsed.aosData[parsed.aosData.length-1].p})`);\n  });\n  return {newData, log};\n}\n\nfunction handleAppWorkbookFile(file){\n  const reader = new FileReader();\n  const logEl = document.getElementById('rawLogMi');\n  logEl.className = 'raw-log show';\n  logEl.textContent = `\"${file.name}\" 파일을 읽는 중...`;\n  reader.onload = (e)=>{\n    try{\n      const buf = new Uint8Array(e.target.result);\n      const workbook = XLSX.read(buf, {type:'array', cellDates:true});\n      const {newData, log} = parseAppWorkbookIntoData(workbook);\n      const requiredKeys = ['app_mau_aos','app_mau_ios','app_install_aos','app_install_ios'];\n      const missing = requiredKeys.filter(k=>!newData[k]);\n      if(missing.length>0){\n        logEl.className = 'raw-log show error';\n        logEl.textContent = '업데이트 실패 — 필수 데이터를 찾을 수 없습니다.\\n\\n'+log.join('\\n');\n        return;\n      }\n      Object.assign(DATA, newData);\n\n      buildOverview();\n\n      uploadedAppFileBlob = file;\n      uploadedAppFileName = file.name;\n      document.getElementById('rawDownloadBtnMi').disabled = false;\n      document.getElementById('rawStatusPillMi').textContent = `\"${file.name}\" 데이터 적용됨 · 방금 업데이트`;\n      document.getElementById('rawStatusPillMi').classList.add('ok');\n      const ghBtn = document.getElementById('ghDeployBtn');\n      ghBtn.disabled = false;\n      ghBtn.textContent = 'GitHub에 배포하기';\n      document.getElementById('rawFileMetaMi').textContent = `파일 크기 ${(file.size/1024).toFixed(0)}KB · 업로드 시각 ${new Date().toLocaleString('ko-KR')}`;\n\n      logEl.className = 'raw-log show';\n      logEl.textContent = '✅ 대시보드에 반영되었습니다.\\n\\n'+log.join('\\n');\n    }catch(err){\n      logEl.className = 'raw-log show error';\n      logEl.textContent = '파일을 읽는 중 오류가 발생했습니다: '+err.message;\n    }\n  };\n  reader.onerror = ()=>{\n    logEl.className = 'raw-log show error';\n    logEl.textContent = '파일을 읽을 수 없습니다. 다시 시도해주세요.';\n  };\n  reader.readAsArrayBuffer(file);\n}\n\ndocument.getElementById('rawFileInputMi').addEventListener('change', e=>{\n  if(e.target.files && e.target.files[0]) handleAppWorkbookFile(e.target.files[0]);\n});\n\nconst rawDropMiEl = document.getElementById('rawDropMi');\n['dragenter','dragover'].forEach(evt=>{\n  rawDropMiEl.addEventListener(evt, e=>{ e.preventDefault(); rawDropMiEl.classList.add('drag'); });\n});\n['dragleave','drop'].forEach(evt=>{\n  rawDropMiEl.addEventListener(evt, e=>{ e.preventDefault(); rawDropMiEl.classList.remove('drag'); });\n});\nrawDropMiEl.addEventListener('drop', e=>{\n  const file = e.dataTransfer.files && e.dataTransfer.files[0];\n  if(file) handleAppWorkbookFile(file);\n});\n\ndocument.getElementById('rawDownloadBtnMi').addEventListener('click', ()=>{\n  if(!uploadedAppFileBlob) return;\n  const url = URL.createObjectURL(uploadedAppFileBlob);\n  const a = document.createElement('a');\n  a.href = url; a.download = uploadedAppFileName || 'uploaded.xlsx';\n  document.body.appendChild(a); a.click(); document.body.removeChild(a);\n  URL.revokeObjectURL(url);\n});\n\ndocument.getElementById('rawDownloadDeployedBtnMi').addEventListener('click', async ()=>{\n  try{\n    const res = await fetch('./app-source.xlsx', {cache:'no-store'});\n    if(!res.ok) throw new Error('not found');\n    const blob = await res.blob();\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url; a.download = 'app-source.xlsx';\n    document.body.appendChild(a); a.click(); document.body.removeChild(a);\n    URL.revokeObjectURL(url);\n  }catch(e){\n    alert('아직 GitHub에 배포된 모바일인덱스 원본 파일이 없습니다. 먼저 파일을 업로드하고 \"GitHub에 배포하기\"를 눌러주세요.');\n  }\n});\n\n\ndocument.getElementById('rawDownloadBtn').addEventListener('click', ()=>{\n  if(!uploadedFileBlob) return;\n  const url = URL.createObjectURL(uploadedFileBlob);\n  const a = document.createElement('a');\n  a.href = url; a.download = uploadedFileName || 'uploaded.xlsx';\n  document.body.appendChild(a); a.click(); document.body.removeChild(a);\n  URL.revokeObjectURL(url);\n});\n\ndocument.getElementById('rawDownloadDeployedBtn').addEventListener('click', async ()=>{\n  try{\n    const res = await fetch('./source.xlsx', {cache:'no-store'});\n    if(!res.ok) throw new Error('not found');\n    const blob = await res.blob();\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url; a.download = 'source.xlsx';\n    document.body.appendChild(a); a.click(); document.body.removeChild(a);\n    URL.revokeObjectURL(url);\n  }catch(e){\n    alert('아직 GitHub에 배포된 원본 파일이 없습니다. 먼저 파일을 업로드하고 \"GitHub에 배포하기\"를 눌러주세요.');\n  }\n});\n\n/* ---- GitHub Contents API deploy ---- */\nfunction arrayBufferToBase64(buffer){\n  let binary = '';\n  const bytes = new Uint8Array(buffer);\n  const chunk = 0x8000;\n  for(let i=0;i<bytes.length;i+=chunk){\n    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));\n  }\n  return btoa(binary);\n}\nfunction utf8ToBase64(str){\n  return btoa(unescape(encodeURIComponent(str)));\n}\n\nasync function githubPutFile(token, owner, repo, branch, path, base64Content, message){\n  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;\n  let sha = null;\n  const getRes = await fetch(`${url}?ref=${branch}`, {headers:{Authorization:`token ${token}`, Accept:'application/vnd.github+json'}});\n  if(getRes.ok){ const j = await getRes.json(); sha = j.sha; }\n  else if(getRes.status!==404){\n    const err = await getRes.json().catch(()=>({}));\n    throw new Error(`\"${path}\" 조회 실패: `+(err.message || `HTTP ${getRes.status}`));\n  }\n  const body = {message, content: base64Content, branch};\n  if(sha) body.sha = sha;\n  const res = await fetch(url, {\n    method:'PUT',\n    headers:{Authorization:`token ${token}`, Accept:'application/vnd.github+json', 'Content-Type':'application/json'},\n    body: JSON.stringify(body)\n  });\n  if(!res.ok){\n    const err = await res.json().catch(()=>({}));\n    throw new Error(`\"${path}\" 저장 실패: `+(err.message || `HTTP ${res.status}`));\n  }\n  return res.json();\n}\n\nconst GH_STORAGE_KEY = 'saramin_dashboard_gh_creds';\n\nfunction saveGhCredsIfRequested(){\n  const remember = document.getElementById('ghRemember').checked;\n  if(!remember){\n    try{ localStorage.removeItem(GH_STORAGE_KEY); }catch(e){}\n    return;\n  }\n  const creds = {\n    owner: document.getElementById('ghOwner').value.trim(),\n    repo: document.getElementById('ghRepo').value.trim(),\n    branch: document.getElementById('ghBranch').value.trim(),\n    token: document.getElementById('ghToken').value.trim(),\n  };\n  try{ localStorage.setItem(GH_STORAGE_KEY, JSON.stringify(creds)); }catch(e){}\n}\n\nfunction loadSavedGhCreds(){\n  try{\n    const raw = localStorage.getItem(GH_STORAGE_KEY);\n    if(!raw) return;\n    const creds = JSON.parse(raw);\n    if(creds.owner) document.getElementById('ghOwner').value = creds.owner;\n    if(creds.repo) document.getElementById('ghRepo').value = creds.repo;\n    if(creds.branch) document.getElementById('ghBranch').value = creds.branch;\n    if(creds.token) document.getElementById('ghToken').value = creds.token;\n  }catch(e){\n    // localStorage를 못 쓰는 환경(예: 일부 임베드 뷰)이면 그냥 매번 입력\n  }\n}\n\ndocument.getElementById('ghClearSaved').addEventListener('click', ()=>{\n  try{ localStorage.removeItem(GH_STORAGE_KEY); }catch(e){}\n  document.getElementById('ghToken').value = '';\n  document.getElementById('ghDeployStatus').className = 'raw-log show';\n  document.getElementById('ghDeployStatus').textContent = '이 브라우저에 저장된 GitHub 정보를 지웠습니다.';\n});\n\nfunction sanitizeAscii(s){\n  // keep only printable ASCII (0x20-0x7E); strips smart quotes, zero-width spaces,\n  // stray Korean IME characters, non-breaking spaces, line breaks, etc.\n  return s.replace(/[^\\x20-\\x7E]/g, '').trim();\n}\n\ndocument.getElementById('ghDeployBtn').addEventListener('click', async ()=>{\n  const rawToken = document.getElementById('ghToken').value;\n  const rawOwner = document.getElementById('ghOwner').value;\n  const rawRepo = document.getElementById('ghRepo').value;\n  const rawBranch = document.getElementById('ghBranch').value;\n  const token = sanitizeAscii(rawToken);\n  const owner = sanitizeAscii(rawOwner);\n  const repo = sanitizeAscii(rawRepo);\n  const branch = sanitizeAscii(rawBranch) || 'main';\n  const statusEl = document.getElementById('ghDeployStatus');\n\n  const dirty = [];\n  if(token !== rawToken.trim()) dirty.push('토큰');\n  if(owner !== rawOwner.trim()) dirty.push('사용자명');\n  if(repo !== rawRepo.trim()) dirty.push('저장소 이름');\n  if(branch !== (rawBranch.trim()||'main')) dirty.push('브랜치');\n  if(dirty.length>0){\n    // reflect the cleaned values back into the fields so the person can see what was removed\n    document.getElementById('ghToken').value = token;\n    document.getElementById('ghOwner').value = owner;\n    document.getElementById('ghRepo').value = repo;\n    document.getElementById('ghBranch').value = branch;\n  }\n\n  if(!token || !owner || !repo){\n    statusEl.className = 'raw-log show error';\n    statusEl.textContent = 'GitHub 사용자명 / 저장소 / 토큰을 모두 입력해주세요.';\n    return;\n  }\n  if(!uploadedFileBlob && !uploadedAppFileBlob){\n    statusEl.className = 'raw-log show error';\n    statusEl.textContent = '먼저 위에서 새 데이터 파일을 업로드해주세요 (코리안클릭 또는 모바일인덱스 중 하나 이상).';\n    return;\n  }\n  const btn = document.getElementById('ghDeployBtn');\n  btn.disabled = true; btn.textContent = '배포 중...';\n  statusEl.className = 'raw-log show';\n  const cleanedNote = dirty.length>0 ? `\\n\\n(참고: ${dirty.join(', ')} 입력값에서 눈에 보이지 않는 특수문자를 자동으로 제거했습니다. 위 입력창 값이 정상인지 한 번 확인해주세요.)` : '';\n  const savedFiles = [];\n  try{\n    statusEl.textContent = 'data.json 저장 중...';\n    const dataStr = JSON.stringify(DATA);\n    const commitLabel = [uploadedFileName, uploadedAppFileName].filter(Boolean).join(' / ');\n    await githubPutFile(token, owner, repo, branch, 'data.json', utf8ToBase64(dataStr), '데이터 갱신: '+commitLabel);\n    savedFiles.push('data.json');\n\n    if(uploadedFileBlob){\n      statusEl.textContent = 'source.xlsx (코리안클릭) 저장 중...';\n      const buf = await uploadedFileBlob.arrayBuffer();\n      await githubPutFile(token, owner, repo, branch, 'source.xlsx', arrayBufferToBase64(buf), '코리안클릭 원본 파일 갱신: '+uploadedFileName);\n      savedFiles.push('source.xlsx');\n    }\n    if(uploadedAppFileBlob){\n      statusEl.textContent = 'app-source.xlsx (모바일인덱스) 저장 중...';\n      const buf2 = await uploadedAppFileBlob.arrayBuffer();\n      await githubPutFile(token, owner, repo, branch, 'app-source.xlsx', arrayBufferToBase64(buf2), '모바일인덱스 원본 파일 갱신: '+uploadedAppFileName);\n      savedFiles.push('app-source.xlsx');\n    }\n\n    saveGhCredsIfRequested();\n    statusEl.textContent = `✅ 배포 완료! 1~2분 후 사이트에 자동으로 반영됩니다. (${savedFiles.join(', ')} 저장됨)`+cleanedNote;\n    btn.textContent = 'GitHub에 배포하기';\n  }catch(err){\n    statusEl.className = 'raw-log show error';\n    statusEl.textContent = '❌ 배포 실패: '+err.message+'\\\\n\\\\n토큰 권한(Contents: Read and write)과 저장소/브랜치 이름을 확인해주세요.'+cleanedNote;\n    btn.textContent = 'GitHub에 배포하기';\n  }finally{\n    btn.disabled = false;\n  }\n});\n\ndocument.getElementById('rawSourceSeg').addEventListener('click', e=>{\n  const btn = e.target.closest('button'); if(!btn) return;\n  document.querySelectorAll('#rawSourceSeg button').forEach(b=>b.classList.remove('active'));\n  btn.classList.add('active');\n  const src = btn.dataset.source;\n  document.getElementById('panel-raw-kc').style.display = src==='kc' ? 'block' : 'none';\n  document.getElementById('panel-raw-mi').style.display = src==='mi' ? 'block' : 'none';\n});\n\n/* ============ INIT ============ */\nconst ADMIN_VISIBLE_KEY = 'saramin_dashboard_admin_visible';\n\nfunction setAdminVisible(visible){\n  document.getElementById('ghAdminSection').style.display = visible ? 'block' : 'none';\n  try{\n    if(visible) sessionStorage.setItem(ADMIN_VISIBLE_KEY, '1');\n    else sessionStorage.removeItem(ADMIN_VISIBLE_KEY);\n  }catch(e){}\n}\n\ndocument.getElementById('adminToggle').addEventListener('click', ()=>{\n  const isVisible = document.getElementById('ghAdminSection').style.display === 'block';\n  setAdminVisible(!isVisible);\n});\n\n/* ============ COMPETITOR NEWS CALENDAR ============ */\nconst SAMPLE_NEWS = [\n  {date:'2026-08-05', brand:'사람인', title:'(예시) 사람인, AI 채용 매칭 서비스 신규 출시', url:'#', source:'예시기사 · 실제 데이터 연동 전 샘플입니다'},\n  {date:'2026-08-03', brand:'잡코리아', title:'(예시) 잡코리아, 하반기 채용 트렌드 보고서 발표', url:'#', source:'예시기사'},\n  {date:'2026-07-28', brand:'원티드', title:'(예시) 원티드랩, 신규 투자 유치 소식', url:'#', source:'예시기사'},\n];\n\nconst newsState = {year:new Date().getFullYear(), month:new Date().getMonth(), items:[], activeBrands:new Set(), selectedDate:null};\n\nfunction newsColorOf(brand){\n  const known = colorOf(brand);\n  if(known && known !== resolveColor('#9AA1B2')) return known;\n  // fallback: stable hash-based color for brands outside the known palette\n  let h = 0; for(let i=0;i<brand.length;i++) h = (h*31 + brand.charCodeAt(i)) % 360;\n  return `hsl(${h}, 60%, 45%)`;\n}\n\nasync function loadCompetitorNews(){\n  const pill = document.getElementById('newsStatusPill');\n  try{\n    const res = await fetch('./competitor-news.json', {cache:'no-store'});\n    if(res.ok){\n      const json = await res.json();\n      newsState.items = Array.isArray(json) ? json : (json.items || []);\n      pill.textContent = `최신 뉴스 데이터 표시 중 · ${newsState.items.length}건`;\n      pill.classList.add('ok');\n    } else {\n      throw new Error('not found');\n    }\n  }catch(e){\n    newsState.items = SAMPLE_NEWS;\n    pill.textContent = '⚠ 아직 자동 수집 데이터가 없어 샘플로 표시 중입니다';\n  }\n  const brands = [...new Set(newsState.items.map(i=>i.brand))];\n  brands.forEach(b=>newsState.activeBrands.add(b));\n  renderNewsBrandLegend(brands);\n  renderCalendar();\n}\n\nfunction renderNewsBrandLegend(brands){\n  const el = document.getElementById('newsBrandLegend');\n  el.innerHTML = brands.map(b=>{\n    const active = newsState.activeBrands.has(b);\n    return `<span class=\"chip ${active?'active':''}\" data-brand=\"${b}\" style=\"--c:${newsColorOf(b)}\"><span class=\"sw\"><\u002Fspan>${b}<\u002Fspan>`;\n  }).join('');\n  el.querySelectorAll('.chip').forEach(chip=>{\n    chip.addEventListener('click', ()=>{\n      const b = chip.dataset.brand;\n      if(newsState.activeBrands.has(b)) newsState.activeBrands.delete(b); else newsState.activeBrands.add(b);\n      renderNewsBrandLegend(brands);\n      renderCalendar();\n    });\n  });\n}\n\nfunction filteredNewsItems(){\n  return newsState.items.filter(i=>newsState.activeBrands.has(i.brand));\n}\n\nfunction shortIssueLabel(title, brand){\n  let t = String(title||'').replace(brand, '').trim();\n  t = t.replace(/^[,、:;\\-–—·\\s]+/, '').trim();\n  if(!t) t = String(title||'');\n  return t.length > 13 ? t.slice(0,13)+'…' : t;\n}\n\nfunction renderCalendar(){\n  const {year, month} = newsState;\n  document.getElementById('calMonthLabel').textContent = `${year}년 ${month+1}월`;\n  const firstDay = new Date(year, month, 1).getDay();\n  const daysInMonth = new Date(year, month+1, 0).getDate();\n  const todayStr = new Date().toISOString().slice(0,10);\n\n  // 2026년 이전으로는 못 넘어가게 이전 달 버튼 비활성화\n  const prevBtn = document.getElementById('calPrevBtn');\n  if(prevBtn) prevBtn.disabled = (year===2026 && month===0);\n\n  const itemsByDate = {};\n  filteredNewsItems().forEach(it=>{\n    (itemsByDate[it.date] = itemsByDate[it.date] || []).push(it);\n  });\n\n  const MAX_LINES = 5;\n  let html = '';\n  for(let i=0;i<firstDay;i++) html += '<div class=\"cal-day empty\"><\u002Fdiv>';\n  for(let d=1; d<=daysInMonth; d++){\n    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;\n    const dayItems = itemsByDate[dateStr] || [];\n    const isToday = dateStr === todayStr;\n    const isSelected = dateStr === newsState.selectedDate;\n    const shown = dayItems.slice(0, MAX_LINES);\n    const lines = shown.map(it=>`\n      <div class=\"cal-issue-line\" title=\"${it.title}\">\n        <span class=\"cal-dot\" style=\"background:${newsColorOf(it.brand)};\"><\u002Fspan>\n        <span class=\"cal-issue-text\">${shortIssueLabel(it.title, it.brand)}<\u002Fspan>\n      <\u002Fdiv>`).join('');\n    const more = dayItems.length > MAX_LINES ? `<div class=\"cal-day-more\">+${dayItems.length - MAX_LINES}개<\u002Fdiv>` : '';\n    html += `<div class=\"cal-day ${isToday?'today':''} ${isSelected?'selected':''}\" data-date=\"${dateStr}\">\n      <div class=\"cal-day-num\">${d}<\u002Fdiv>\n      <div class=\"cal-issue-lines\">${lines}${more}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }\n  document.getElementById('calDaysGrid').innerHTML = html;\n  document.querySelectorAll('#calDaysGrid .cal-day:not(.empty)').forEach(cell=>{\n    cell.addEventListener('click', ()=>{\n      const d = cell.dataset.date;\n      newsState.selectedDate = (newsState.selectedDate===d) ? null : d;\n      renderCalendar();\n      renderNewsList();\n    });\n  });\n  renderNewsList();\n}\n\nfunction renderNewsList(){\n  const listEl = document.getElementById('newsList');\n  const titleEl = document.getElementById('newsListTitle');\n  const hintEl = document.getElementById('newsListHint');\n  let items = filteredNewsItems();\n  if(newsState.selectedDate){\n    items = items.filter(i=>i.date===newsState.selectedDate);\n    titleEl.textContent = `${newsState.selectedDate} 기사`;\n    hintEl.textContent = `${items.length}건 · 다시 클릭하면 전체 보기`;\n  } else {\n    items = items.slice().sort((a,b)=> b.date.localeCompare(a.date)).slice(0,20);\n    titleEl.textContent = '최근 기사';\n    hintEl.textContent = '최신순 20건';\n  }\n  if(items.length===0){\n    listEl.innerHTML = '<div class=\"note\" style=\"padding:16px 0;\">해당 조건의 기사가 없습니다.<\u002Fdiv>';\n    return;\n  }\n  listEl.innerHTML = items.map(it=>`\n    <div class=\"news-item\">\n      <span class=\"news-item-tag\" style=\"background:${newsColorOf(it.brand)};\">${it.brand}<\u002Fspan>\n      <div class=\"news-item-body\">\n        <a class=\"news-item-title\" href=\"${it.url}\" target=\"_blank\" rel=\"noopener\">${it.title}<\u002Fa>\n        ${it.sentiment==='positive' ? '<span class=\"sentiment-badge positive\">긍정<\u002Fspan>' : ''}\n        ${it.sentiment==='negative' ? '<span class=\"sentiment-badge negative\">부정<\u002Fspan>' : ''}\n        <div class=\"news-item-meta\">${it.date} · ${it.source||''}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`).join('');\n}\n\ndocument.getElementById('calPrevBtn').addEventListener('click', ()=>{\n  if(newsState.year===2026 && newsState.month===0) return; // 2026년 이전으로는 이동 불가\n  newsState.month--; if(newsState.month<0){ newsState.month=11; newsState.year--; }\n  newsState.selectedDate = null;\n  renderCalendar();\n});\ndocument.getElementById('calNextBtn').addEventListener('click', ()=>{\n  newsState.month++; if(newsState.month>11){ newsState.month=0; newsState.year++; }\n  newsState.selectedDate = null;\n  renderCalendar();\n});\ndocument.getElementById('calTodayBtn').addEventListener('click', ()=>{\n  const now = new Date();\n  newsState.year = now.getFullYear(); newsState.month = now.getMonth();\n  newsState.selectedDate = null;\n  renderCalendar();\n});\n\n/* ============ APP STORE RANKS ============ */\nconst SAMPLE_APP_RANKS = {\n  updatedAt: null,\n  aos: [\n    {brand:'사람인', rank:null, prevRank:null},\n    {brand:'잡코리아', rank:null, prevRank:null},\n    {brand:'원티드', rank:null, prevRank:null},\n    {brand:'인크루트', rank:null, prevRank:null},\n    {brand:'리멤버', rank:null, prevRank:null},\n    {brand:'알바몬', rank:null, prevRank:null},\n    {brand:'알바천국', rank:null, prevRank:null},\n    {brand:'동네알바', rank:null, prevRank:null},\n    {brand:'급구', rank:null, prevRank:null},\n    {brand:'잡플래닛', rank:null, prevRank:null},\n  ],\n  ios: [\n    {brand:'사람인', rank:null, prevRank:null},\n    {brand:'잡코리아', rank:null, prevRank:null},\n    {brand:'원티드', rank:null, prevRank:null},\n    {brand:'인크루트', rank:null, prevRank:null},\n    {brand:'리멤버', rank:null, prevRank:null},\n    {brand:'알바몬', rank:null, prevRank:null},\n    {brand:'알바천국', rank:null, prevRank:null},\n    {brand:'동네알바', rank:null, prevRank:null},\n    {brand:'급구', rank:null, prevRank:null},\n    {brand:'잡플래닛', rank:null, prevRank:null},\n  ],\n};\n\nconst appRankState = {device:'aos', data:null};\n\nasync function loadAppRanks(){\n  const pill = document.getElementById('appRankStatusPill');\n  try{\n    const res = await fetch('./app-ranks.json', {cache:'no-store'});\n    if(res.ok){\n      appRankState.data = await res.json();\n      const stamp = appRankState.data.updatedAt ? new Date(appRankState.data.updatedAt).toLocaleString('ko-KR') : '-';\n      pill.textContent = `최신 순위 데이터 표시 중 · ${stamp}`;\n      pill.classList.add('ok');\n    } else {\n      throw new Error('not found');\n    }\n  }catch(e){\n    appRankState.data = SAMPLE_APP_RANKS;\n    pill.textContent = '⚠ 아직 자동 수집 데이터가 없어 샘플 화면으로 표시 중입니다';\n  }\n  renderAppRankList();\n}\n\nfunction renderAppRankList(){\n  const data = appRankState.data || {};\n  const byBrand = new Map();\n  ['aos','ios'].forEach(dev=>{\n    (data[dev]||[]).forEach(it=>{\n      const row = byBrand.get(it.brand) || {brand:it.brand};\n      row[dev] = it.rank;\n      row[dev+'Prev'] = it.prevRank;\n      byBrand.set(it.brand, row);\n    });\n  });\n  const rows = [...byBrand.values()].sort((a,b)=>{\n    const ka = Math.min(a.aos ?? 9999, a.ios ?? 9999);\n    const kb = Math.min(b.aos ?? 9999, b.ios ?? 9999);\n    if(ka!==kb) return ka-kb;\n    return a.brand.localeCompare(b.brand,'ko');\n  });\n  const hasAnyPrev = rows.some(r=>(r.aos!=null&&r.aosPrev!=null)||(r.ios!=null&&r.iosPrev!=null));\n\n  function rankCell(rank){\n    if(rank==null) return '<span style=\"color:var(--text-faint);\">차트 밖<\u002Fspan>';\n    return `<b style=\"font-weight:700;\">${rank}<\u002Fb><span style=\"color:var(--text-faint);font-weight:500;\">위<\u002Fspan>`;\n  }\n  function deltaCell(rank, prev){\n    if(rank==null || prev==null) return '<span style=\"color:var(--text-faint);\">—<\u002Fspan>';\n    const diff = prev - rank;\n    if(diff>0) return `<span style=\"color:var(--accent-red);font-weight:600;\">▲ ${diff}<\u002Fspan>`;\n    if(diff<0) return `<span style=\"color:var(--accent-navy);font-weight:600;\">▼ ${Math.abs(diff)}<\u002Fspan>`;\n    return '<span style=\"color:var(--text-faint);\">·<\u002Fspan>';\n  }\n\n  const html = `<thead><tr>\n      <th style=\"text-align:left;\">브랜드<\u002Fth>\n      <th>Android 순위<\u002Fth><th>변동<\u002Fth>\n      <th>iOS 순위<\u002Fth><th>변동<\u002Fth>\n    <\u002Ftr><\u002Fthead><tbody>` + rows.map(r=>`\n    <tr class=\"${r.brand==='사람인'?'highlight':''}\">\n      <td><span style=\"display:inline-flex;align-items:center;gap:7px;\"><span style=\"width:8px;height:8px;border-radius:50%;background:${colorOf(r.brand)};\"><\u002Fspan>${r.brand}<\u002Fspan><\u002Ftd>\n      <td>${rankCell(r.aos)}<\u002Ftd><td>${deltaCell(r.aos, r.aosPrev)}<\u002Ftd>\n      <td>${rankCell(r.ios)}<\u002Ftd><td>${deltaCell(r.ios, r.iosPrev)}<\u002Ftd>\n    <\u002Ftr>`).join('') + '<\u002Ftbody>';\n  document.getElementById('appRankTable').innerHTML = html;\n\n  const captionEl = document.getElementById('appRankCaption');\n  if(captionEl){\n    captionEl.textContent = hasAnyPrev\n      ? '▲▼: 직전 조회 대비 순위 변동 · 차트에 잡히는 범위(상위 100위 내외) 밖이면 \"차트 밖\"으로 표시됩니다'\n      : '순위 변동(▲▼)은 다음 번 조회부터 비교 데이터가 쌓이면 표시됩니다 · 차트에 잡히는 범위(상위 100위 내외) 밖이면 \"차트 밖\"으로 표시됩니다';\n  }\n}\n\n\n\nasync function initDashboard(){\n  loadSavedGhCreds();\n  // GitHub 배포 카드는 기본적으로 숨김. ?admin=1 로 접속했거나,\n  // 같은 탭 세션에서 ⚙ 아이콘으로 이미 열어둔 적이 있으면 계속 보이게 유지.\n  let showAdmin = false;\n  try{\n    const params = new URLSearchParams(location.search);\n    if(params.get('admin')==='1') showAdmin = true;\n    if(sessionStorage.getItem(ADMIN_VISIBLE_KEY)==='1') showAdmin = true;\n  }catch(e){}\n  if(showAdmin) setAdminVisible(true);\n\n  try{\n    const res = await fetch('./data.json', {cache:'no-store'});\n    if(res.ok){\n      const json = await res.json();\n      Object.assign(DATA, json);\n      document.getElementById('rawStatusPill').textContent = 'GitHub에 배포된 최신 데이터 표시 중';\n      document.getElementById('rawStatusPill').classList.add('ok');\n      document.getElementById('rawStatusPillMi').textContent = 'GitHub에 배포된 최신 데이터 표시 중';\n      document.getElementById('rawStatusPillMi').classList.add('ok');\n    }\n  }catch(e){\n    // data.json이 없거나(로컬 파일로 직접 열었거나) 아직 배포 전이면 최초 생성 데이터로 표시\n  }\n  buildOverview();\n  refreshTraffic(true);\n  setupAppMetricTab({\n    prefix: 'mau',\n    chartId: 'chartMau',\n    dataKeys: {aos:'app_mau_aos', ios:'app_mau_ios'},\n    deviceLabels: {aos:'Android (AOS)', ios:'iOS'},\n    titleWord: '활성 사용자수',\n  });\n  setupAppMetricTab({\n    prefix: 'install',\n    chartId: 'chartInstall',\n    dataKeys: {aos:'app_install_aos', ios:'app_install_ios'},\n    deviceLabels: {aos:'Android (AOS)', ios:'iOS'},\n    titleWord: '신규 설치수',\n  });\n  loadCompetitorNews();\n  loadAppRanks();\n}\ninitDashboard();\n\n/* ===================== v6 INTERACTION LAYER ===================== */\n(function(){\n  const prefersReduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n  const COUNT_MS = 300;\n  const easeOutExpo = t => t===1 ? 1 : 1-Math.pow(2,-9*t);\n\n  function countUp(node, target){\n    const start = performance.now();\n    const from = Math.round(target * 0.08);\n    function step(now){\n      const p = Math.min(1,(now-start)/COUNT_MS);\n      const v = from + (target-from)*easeOutExpo(p);\n      node.nodeValue = Math.round(v).toLocaleString('ko-KR');\n      if(p<1) requestAnimationFrame(step);\n    }\n    requestAnimationFrame(step);\n  }\n  function animateNumbers(){\n    document.querySelectorAll('#kpiCards .kpi-split-value, #appKpiCards .kpi-split-value').forEach(el=>{\n      const node = [...el.childNodes].find(n=>n.nodeType===3 && /[0-9]/.test(n.nodeValue));\n      if(!node) return;\n      const target = parseFloat(node.nodeValue.replace(/[^0-9.-]/g,''));\n      if(isNaN(target)) return;\n      if(el.dataset.cu === String(target)) return;\n      el.dataset.cu = String(target);\n      if(prefersReduce) return;\n      countUp(node, target);\n    });\n  }\n\n  function animateBars(){\n    document.querySelectorAll('.rank-bar').forEach((bar,i)=>{\n      const w = bar.style.width;\n      if(!w || bar.dataset.w === w) return;\n      bar.dataset.w = w;\n      bar.style.transitionDelay = (i*70)+'ms';\n      bar.style.width = '0%';\n      void bar.offsetWidth;\n      requestAnimationFrame(()=>{ bar.style.width = w; });\n    });\n  }\n\n  const io = new IntersectionObserver(entries=>{\n    entries.forEach(e=>{\n      if(e.isIntersecting){\n        const idx = [...e.target.parentNode.children].indexOf(e.target);\n        e.target.style.transitionDelay = Math.min(idx,6)*60+'ms';\n        e.target.classList.add('in');\n        io.unobserve(e.target);\n      }\n    });\n  }, {threshold:0.06, rootMargin:'0px 0px -40px 0px'});\n\n  function setupReveal(root){\n    if(prefersReduce) return;\n    (root||document).querySelectorAll('.card, .section-row').forEach(el=>{\n      if(el.dataset.rv) return;\n      el.dataset.rv = '1';\n      el.classList.add('rv');\n      io.observe(el);\n    });\n    setTimeout(()=>{ (root||document).querySelectorAll('.rv:not(.in)').forEach(el=>{\n      const r = el.getBoundingClientRect();\n      if(r.top < window.innerHeight && r.bottom > 0) el.classList.add('in');\n    }); }, 1400);\n  }\n\n  let busy = false, timer = null;\n  function refreshFx(){\n    busy = true;\n    animateNumbers(); animateBars();\n    setTimeout(()=>{ busy = false; }, 300);\n  }\n  const mo = new MutationObserver(()=>{\n    if(busy) return;\n    clearTimeout(timer); timer = setTimeout(refreshFx, 40);\n  });\n  ['kpiCards','appKpiCards','rankList'].forEach(id=>{\n    const el = document.getElementById(id);\n    if(el) mo.observe(el, {childList:true, subtree:true});\n  });\n\n  document.querySelectorAll('.nav-item').forEach(item=>{\n    item.addEventListener('click', ()=>{\n      const sec = document.getElementById('sec-'+item.dataset.section);\n      if(!sec) return;\n      sec.querySelectorAll('.rv').forEach(el=>{ el.classList.remove('in'); el.removeAttribute('data-rv'); });\n      setupReveal(sec);\n      setTimeout(refreshFx, 60);\n      setTimeout(()=>{ try{ Object.values(Chart.instances||{}).forEach(c=>{\n        if(sec.contains(c.canvas)){ c.$rev = 0; c.$revStart = null; c.resize(); c.draw(); }\n      }); }catch(e){} }, 80);\n    });\n  });\n\n  const app = document.querySelector('.app');\n  const cBtn = document.getElementById('collapseBtn');\n  function setCollapsed(on){\n    app.classList.toggle('collapsed', on);\n    cBtn.innerHTML = on ? '⇥' : '⇤ <span class=\"label\">접기<\u002Fspan>';\n    try{ localStorage.setItem('saramin_nav_collapsed', on?'1':'0'); }catch(e){}\n    setTimeout(()=>{ try{ Object.values(Chart.instances||{}).forEach(c=>c.resize()); }catch(e){} }, 340);\n  }\n  cBtn.addEventListener('click', ()=> setCollapsed(!app.classList.contains('collapsed')));\n  try{ if(localStorage.getItem('saramin_nav_collapsed')==='1') setCollapsed(true); }catch(e){}\n\n  const tBtn = document.getElementById('themeBtn');\n  function applyTheme(dark){\n    document.documentElement.setAttribute('data-theme', dark?'dark':'light');\n    tBtn.textContent = dark ? '☀️' : '🌙';\n    try{ localStorage.setItem('saramin_theme', dark?'dark':'light'); }catch(e){}\n    const cs = getComputedStyle(document.documentElement);\n    const grid = cs.getPropertyValue('--grid-line').trim();\n    const txt  = cs.getPropertyValue('--text-sub').trim();\n    try{\n      Chart.defaults.color = txt; Chart.defaults.borderColor = grid;\n      Object.values(Chart.instances||{}).forEach(c=>{\n        if(c.options.scales && c.options.scales.y && c.options.scales.y.grid) c.options.scales.y.grid.color = grid;\n        c.options.color = txt;\n        if(c.options.scales){ Object.values(c.options.scales).forEach(s=>{ if(s.ticks) s.ticks.color = txt; }); }\n        c.update('none');\n      });\n    }catch(e){}\n  }\n  tBtn.addEventListener('click', ()=> applyTheme(document.documentElement.getAttribute('data-theme')!=='dark'));\n  try{ if(localStorage.getItem('saramin_theme')==='dark') applyTheme(true); }catch(e){}\n\n  setupReveal(document);\n  setTimeout(refreshFx, 400);\n  setTimeout(refreshFx, 1200);\n})();\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
